<header class="site">
  <div class="wrap">
    <a class="mark" href="{{ '/' | relative_url }}">JT<span>_</span>ROBOTICS</a>
    <div class="header-right">
      <nav class="links" id="site-nav" aria-label="Primary">
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/#experience' | relative_url }}">Experience</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' or page.layout == 'post' %} class="active"{% endif %}>Notes</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <line x1="12" y1="2" x2="12" y2="4.5"></line>
          <line x1="12" y1="19.5" x2="12" y2="22"></line>
          <line x1="4.2" y1="4.2" x2="5.9" y2="5.9"></line>
          <line x1="18.1" y1="18.1" x2="19.8" y2="19.8"></line>
          <line x1="2" y1="12" x2="4.5" y2="12"></line>
          <line x1="19.5" y1="12" x2="22" y2="12"></line>
          <line x1="4.2" y1="19.8" x2="5.9" y2="18.1"></line>
          <line x1="18.1" y1="5.9" x2="19.8" y2="4.2"></line>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"></path>
        </svg>
      </button>
      <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </div>
</header>
